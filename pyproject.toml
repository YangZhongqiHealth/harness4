[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "harness4"
version = "0.4.0a0"
requires-python = ">=3.11"
description = "Open, model-portable PR review and policy reports"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]
[project.scripts]
h4 = "harness4.cli:main"
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
