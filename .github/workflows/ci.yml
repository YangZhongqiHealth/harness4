name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]' build
      - run: python scripts/check_docs.py
      - run: python -m pytest -q
      - run: python -m build
      - name: Install the built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed package outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import harness4; from pathlib import Path; assert 'site-packages' in Path(harness4.__file__).parts, harness4.__file__"
          h4 --version
          h4 --help
          h4 ship-github --help
          h4 learning --help
          h4 doctor --offline --model fixture --base-url https://example.invalid/v1
          python "$GITHUB_WORKSPACE/examples/provider_tools.py"
          python "$GITHUB_WORKSPACE/examples/durable_task.py"
          python "$GITHUB_WORKSPACE/examples/learning_demo.py"
          python -m pytest -q -c /dev/null "$GITHUB_WORKSPACE/tests/test_ship.py" "$GITHUB_WORKSPACE/tests/test_github_workflow.py" "$GITHUB_WORKSPACE/tests/test_learning.py"
