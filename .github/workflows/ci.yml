name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest -q
      - run: h4 --help
      - run: h4 ship-github --help
      - run: h4 doctor --offline --model fixture --base-url https://example.invalid/v1
      - run: python examples/provider_tools.py
      - run: python examples/durable_task.py
      - run: python -m build
