# Copy into your repository's .github/workflows/ship-observe.yml.
# Offline policy inspection only: no AI review, API keys, repair or approval.
# Update the Harness4 commit only after reviewing/testing the new version.
name: Ship observe
on: [pull_request]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted target base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: target
          fetch-depth: 0
      - name: Check out a reviewed Harness4 version separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: YangZhongqiHealth/harness4
          ref: 1619e7e2a4a46bf455ae4efa66dc222dea4e94f9
          path: harness4-tool
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install Harness4, never the target project
        run: python -m pip install ./harness4-tool
      - name: Produce advisory report without executing target code
        env:
          PR_NUMBER: ${{ github.event.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C target fetch origin "refs/pull/${PR_NUMBER}/head"
          PR_HEAD_SHA=$(git -C target rev-parse FETCH_HEAD)
          PR_MERGE_BASE=$(git -C target merge-base "$BASE_SHA" "$PR_HEAD_SHA")
          h4 ship --repo target --base "$PR_MERGE_BASE" --head "$PR_HEAD_SHA" --checks unknown > ship-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ship-report
          path: ship-report.json
          retention-days: 7
